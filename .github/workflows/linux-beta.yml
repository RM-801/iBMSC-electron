name: Linux Beta packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft beta release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: linux-beta-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node -e 'const p=require("./package.json"); if (!process.env.RELEASE_TAG.startsWith("v"+p.version+"-beta.")) throw Error("Release tag/version mismatch")'
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2 desktop-file-utils
      - name: Install dependencies
        run: |
          npm ci
          npx --no-install install-electron
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build AppImage and Debian package
        run: npm run package:linux
      - name: Verify packages and application startup
        run: node scripts/verify-linux.mjs
      - name: Prepare release files
        run: |
          mkdir release-files
          cp dist/linux-*/iBMSC-*.AppImage dist/linux-*/iBMSC-*.deb release-files/
          cd release-files
          sha256sum *.AppImage *.deb > SHA256SUMS-linux-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-files/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-files
      - name: Attach verified Linux packages to draft beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isPrerelease,isDraft --jq '.isPrerelease and .isDraft' | grep -x true
          gh release upload "$RELEASE_TAG" release-files/*
